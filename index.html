<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="$description">
  <title>$title</title>
  <link rel="icon" type="image/png" sizes="96x96" href="${root}images/cirp-mark.png">
  <script>
    try {
      const saved = localStorage.getItem("cirp-theme");
      if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="stylesheet" href="${root}styles.css?v=${styles_version}">
  $legacy
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="mast">
    <div class="mast-inner">
      <div class="brand">
        <a href="${root}" aria-label="CIRP Lab home"><img src="${root}images/cirp-mark.png" alt="" width="30" height="30"><strong>CIRP</strong></a>
        <span aria-hidden="true">/</span>
        <a href="https://www.ics.hawaii.edu/" aria-label="ICS — Department of Information and Computer Sciences">ICS</a>
        <span aria-hidden="true">/</span>
        <a href="https://manoa.hawaii.edu/" aria-label="UH Mānoa — University of Hawaiʻi at Mānoa">UH Mānoa</a>
      </div>
      <nav aria-label="Main navigation">$nav</nav>
      <button class="theme" type="button" hidden>
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g>
          <path class="moon" d="M20.5 14a8.6 8.6 0 0 1-10.6-10.5A8.7 8.7 0 1 0 20.5 14Z"/>
        </svg>
      </button>
    </div>
  </header>
  <main id="content" class="wrap">$content</main>
  <footer class="wrap foot"><a class="foot-brand" href="${root}">CIRP Lab</a><span><a href="https://www.ics.hawaii.edu/">Information and Computer Sciences</a> · <a href="https://manoa.hawaii.edu/">University of Hawaiʻi at Mānoa</a></span><a href="${root}contact/">Contact</a></footer>
  <script>
    const button = document.querySelector(".theme");
    const site = document.documentElement;
    const systemDark = matchMedia("(prefers-color-scheme: dark)");
    function updateThemeButton() {
      const current = site.dataset.theme || (systemDark.matches ? "dark" : "light");
      button.value = current === "dark" ? "light" : "dark";
      button.title = "Switch to " + button.value + " mode";
      button.setAttribute("aria-label", button.title);
    }
    updateThemeButton();
    button.hidden = false;
    button.addEventListener("click", () => {
      const next = button.value;
      site.dataset.theme = next;
      try { localStorage.setItem("cirp-theme", next); } catch {}
      updateThemeButton();
    });
    systemDark.addEventListener("change", updateThemeButton);
    window.addEventListener("storage", event => {
      if (event.key !== "cirp-theme" && event.key !== null) return;
      if (event.newValue === "dark" || event.newValue === "light") site.dataset.theme = event.newValue;
      else delete site.dataset.theme;
      updateThemeButton();
    });
  </script>
</body>
</html>
